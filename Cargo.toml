[package]
name = "alloy-core-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
oxc = "0.152.0"
oxc_allocator = "0.152.0"
oxc_ast = { version = "0.152.0", features = ["serialize"] }
oxc_estree = { version = "0.152.0", features = ["serialize"] }
oxc_parser = "0.152.0"
oxc_span = "0.152.0"
rocket = "0.5.1"
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2"
