[package]
name = "repository"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.2", features = ["napi6", "serde-json"] }
napi-derive = "3.6.12"
futures = "0.3.34"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1.0.154", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2.6.0"
