[package]
name = "alloy-engine-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
async-runtime = "0.3.6"
futures-executor = { version = "0.3.34", features = ["thread-pool"] }
napi = { version = "3", features = ["serde-json", "napi3", "napi6", "compat-mode"] }
napi-derive = "3"
oxc = { version = "=0.139.0", default-features = false, features = ["codegen"] }
oxc_allocator = "=0.139.0"
oxc_ast = { version = "=0.139.0", features = ["serialize"] }
oxc_codegen = "=0.139.0"
oxc_diagnostics = "=0.139.0"
oxc_estree = { version = "=0.139.0", features = ["serialize"] }
oxc_napi = "=0.139.0"
oxc_parser = "=0.139.0"
oxc_span = "=0.139.0"
oxc-browserslist = "=3.0.9"
oxc_sourcemap = "=8.0.2"
rocket = "0.5.1"
rquickjs = { version = "0.14.0", features = ["loader"] }
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2"
