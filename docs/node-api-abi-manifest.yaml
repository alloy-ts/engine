schema_version: 1
status: design_only
header_policy:
  source: official_node_api_headers_to_be_vendored_and_checksummed
  planning_reference: node_modules/emnapi/include/node
  stable_target_version: 8
  experimental: false

abi_families:
  - registration
  - core
  - node_extension
  - buffer_extension
  - async
  - libuv
  - legacy
  - experimental

opaque_types:
  - name: napi_env
    declaration: "typedef struct napi_env__* napi_env"
    ownership: one_engine_realm_owner_thread
  - name: napi_value
    declaration: "typedef struct napi_value__* napi_value"
    ownership: environment_handle_table_entry
  - name: napi_callback_info
    declaration: "typedef struct napi_callback_info__* napi_callback_info"
    ownership: active_native_callback_only
  - name: napi_handle_scope
    declaration: "typedef struct napi_handle_scope__* napi_handle_scope"
    ownership: environment_scope_stack
  - name: napi_ref
    declaration: "typedef struct napi_ref__* napi_ref"
    ownership: environment_reference_table

symbols:
  - symbol: napi_register_module_v1
    kind: addon_export
    signature: "napi_value NAPI_CDECL (napi_env env, napi_value exports)"
    header:
      family: node_api
      module_abi_version: 1
    abi_family: registration
    calling_convention:
      windows: __cdecl_and_dllexport
      unix: c_and_default_visibility
    thread_rule: engine_owner_thread_only
    rooting_rule: exports_and_return_value_rooted_in_module_scope
    pending_exception:
      allowed_on_entry: false
      on_exit: initialization_fails_if_pending
    runtime_dependencies: [objects, module_environment]
    fixture: registration/basic.c
    status: blocked_runtime

  - symbol: node_api_module_get_api_version_v1
    kind: optional_addon_export
    signature: "int32_t NAPI_CDECL (void)"
