      family: node_api
      module_abi_version: 1
    abi_family: registration
    calling_convention:
      windows: __cdecl_and_dllexport
      unix: c_and_default_visibility
    thread_rule: loader_thread_before_registration
    rooting_rule: none
    pending_exception:
      allowed_on_entry: not_applicable
      on_exit: not_applicable
    runtime_dependencies: []
    fixture: registration/version.c
    status: blocked_loader

